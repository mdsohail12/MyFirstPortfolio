<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Me</h1>
    <hr>
    <form>

<label >Name</label>
<input type="text" placeholder="Enter our name">
<br><br>

<label >Email</label>
<input type="email" placeholder="Enter your email">
<br><br>

<label >Phone</label>
<input type="number" placeholder="Enter your phone no.">
<br><br>

<label> Gender</label>
<input type="radio" name="gender">
Male
<input type="radio" name="gender">
female
<br><br>

<label>Skills</label>
<input type="checkbox">
Java
<input type="checkbox">
Html
<input type="checkbox">
Css
<br><br>

<label>Experience</label>
<select >
    <option>Fresher</option>
    <option>Experience</option>
    <option>1 yearExperience</option>
</select>
<br><br>



<label >Message</label>
<textarea rows="5" cols="30"
placeholder="Write your message" ></textarea>
<br><br>

<input type="submit" value="Send">
    </form>
    
</body>
</html>
